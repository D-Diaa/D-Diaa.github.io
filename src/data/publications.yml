  title: "ZipPIR: High-throughput Single-server PIR without Client-side Storage"
  topic: "Privacy-Preserving Machine Learning"
  year: 2026
  venue: "35th USENIX Security Symposium"
  citation:
    type: inproceedings
    key: mahdavi2026zippir
    authors:
      - Rasoul Akhavan Mahdavi
      - Abdulrahman Diaa
      - Florian Kerschbaum
    booktitle: "35th USENIX Security Symposium (USENIX Security 26)"
    publisher: USENIX Association
    url: https://arxiv.org/abs/2603.09190
  abstract: "Private Information Retrieval (PIR) allows a client to privately access a database without revealing which element is accessed. Initial PIR protocols based on Ring Learning with Errors (RLWE) demonstrated the practicality of PIR, but achieve limited throughput. Alternatively, high-throughput protocols leverage an offline phase that requires substantial client-side storage (e.g., hints in SimplePIR) or involve prohibitive communication costs during the offline phase (e.g., Piano). These limitations conflict with the practical constraints of resource-limited clients and are further exacerbated by dynamic databases, where updates necessitate costly regeneration and retransmission of hints. To address these challenges, we propose ZipPIR, a high-throughput PIR protocol that compresses LWE ciphertexts into significantly smaller Paillier ciphertexts. ZipPIR leverages the offline phase to obtain this size reduction without incurring the associated computational cost in the online phase. Moreover, under computational assumptions, ZipPIR features an almost silent offline phase, requiring no communication beyond an initial public key, enabling the server to independently generate and update hints during idle times without client interaction. ZipPIR achieves over 2 GB/s of throughput (comparable to state-of-the-art protocols such as SimplePIR) without the need for a large client-stored hint. For PIR over a 1 GB database, ZipPIR has up to 10x higher throughput than existing protocols with no client-side storage, while requiring less than 200 KB of server-side storage per client, significantly enhancing scalability for practical deployments. While prior PIR protocols using Paillier are very inefficient, ZipPIR is the first PIR protocol using Paillier that achieves throughput that is competitive with state-of-the-art PIR protocols. We discuss the use of ZipPIR in the context of certificate transparency using a new solution architecture. Our proposed solution eliminates the need for client-side storage, while enabling PIR over a more recent version of the database."
