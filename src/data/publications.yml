  title: "Optimizing Adaptive Attacks against Watermarks for Language Models"
  topic: "AI-content Watermarking"
  venue: "42nd International Conference on Machine Learning (ICML)"
  year: 2025
  citation:
    type: inproceedings
    key: pmlr-v267-diaa25a
    authors:
      - Abdulrahman Diaa
      - Toluwani Aremu
      - Nils Lukas
    booktitle: Proceedings of the 42nd International Conference on Machine Learning
    series: Proceedings of Machine Learning Research
    volume: "267"
    pages: "13546--13569"
    publisher: PMLR
    url: https://proceedings.mlr.press/v267/diaa25a.html
  abstract: "Large Language Models (LLMs) can be misused to spread unwanted content at scale. Content watermarking deters misuse by hiding messages in content, enabling its detection using a secret watermarking key. Robustness is a core security property, stating that evading detection requires significant degradation of the content's quality. Many LLM watermarking methods have been proposed, but robustness is tested only against non-adaptive attackers who lack knowledge of the watermarking method and can find only suboptimal attacks. We formulate watermark robustness as an objective function and use preference-based optimization to tune adaptive attacks against the specific watermarking method. Our evaluation shows that adaptive attacks evade detection against all surveyed watermarks, training against any watermark succeeds in evading unseen watermarks, and optimization-based attacks are cost-effective. Our findings underscore the need to test robustness against adaptively tuned attacks."
